<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Hintergrund: warmes dunkles Blaugrau -->
  <rect width="100" height="100" rx="22" fill="#1a1f2e"/>

  <!-- Zellen: sanftes Weiß mit leichter Transparenz -->
  <!-- Reihe 1 -->
  <rect x="11" y="11" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="38" y="11" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="65" y="11" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <!-- Reihe 2 -->
  <rect x="11" y="38" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="38" y="38" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="65" y="38" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <!-- Reihe 3 -->
  <rect x="11" y="65" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="38" y="65" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>
  <rect x="65" y="65" width="24" height="24" rx="5" fill="#ffffff" opacity="0.95"/>

  <!-- Zahlen: exakt zentriert per text-anchor + dominant-baseline -->
  <text
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-weight="800"
    font-size="15"
    fill="#1a1f2e"
    text-anchor="middle"
    dominant-baseline="central">
    <!-- Reihe 1: Zellmitte = x+12, y+12 -->
    <tspan x="23" y="23">3</tspan>
    <tspan x="50" y="23">5</tspan>
    <tspan x="77" y="23">1</tspan>
    <!-- Reihe 2 -->
    <tspan x="23" y="50">4</tspan>
    <tspan x="50" y="50">7</tspan>
    <tspan x="77" y="50">2</tspan>
    <!-- Reihe 3 -->
    <tspan x="23" y="77">6</tspan>
    <tspan x="50" y="77">1</tspan>
    <tspan x="77" y="77">3</tspan>
  </text>
</svg>